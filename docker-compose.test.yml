services:
  postgres-test:
    image: postgres:17-alpine
    container_name: assistant-reminder-postgres-test
    environment:
      POSTGRES_USER: assistant_test
      POSTGRES_PASSWORD: assistant_test_password
      POSTGRES_DB: assistant_reminder_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant_test -d assistant_reminder_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7.4-alpine
    container_name: assistant-reminder-redis-test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /data
